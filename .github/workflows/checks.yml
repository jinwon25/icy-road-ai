name: 검증

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: 자체 MLP 검사용 CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: CPU 스레드 제한
        run: |
          echo "OMP_NUM_THREADS=2" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=2" >> "$GITHUB_ENV"
      - run: python -m pytest -q tests
      - run: python scripts/check_repository.py
      - run: python scripts/check_markdown.py
